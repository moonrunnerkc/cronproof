name: scheduled cronproof

# Weekly self-scan: catches any schedule merged since the last run and
# re-checks the tzdb pin, so a tzdb release that moved DST boundaries is
# caught deliberately rather than passing on a stale verdict.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC (GitHub Actions runs cron in UTC)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: scan this repo for schedule hazards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          path: "."
          fail-on: high
          tzdb-check: "2025b"
