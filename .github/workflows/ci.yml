name: ci

on:
  push:
  pull_request:

jobs:
  evidence:
    name: regenerate EVIDENCE.md and fail on drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run evidence:check
      - name: diagnostic regenerate on failure
        if: failure()
        run: npm run evidence >/dev/null 2>&1 || true
      - name: upload regenerated evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-evidence
          path: EVIDENCE.md

  dogfood:
    name: cronproof scans its own repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          path: "."
          fail-on: high
