name: cronproof
description: >
  Scan a repository for cron schedule timezone and DST hazards, upload SARIF so
  the findings show as code-scanning annotations, and fail the check per a
  severity threshold. Supports a baseline of accepted hazards and a tzdb pin.
author: cronproof

branding:
  icon: clock
  color: purple

inputs:
  path:
    description: >
      Path to scan. Use the repository root (the default) so SARIF locations are
      repo-relative and annotations map to the right files.
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the check: info, low, medium, high, or critical."
    required: false
    default: "high"
  baseline:
    description: >
      Path to a baseline file of accepted hazard ids. Hazards in the baseline are
      reported but do not fail the build. Create one with: cronproof baseline.
    required: false
    default: ""
  tzdb-check:
    description: >
      Pinned tzdb release (for example 2025b). The action fails if the runner's
      tzdb differs, because a verdict computed against another tzdb may be stale.
    required: false
    default: ""
  idempotent:
    description: "Set to true if double runs are harmless; lowers DOUBLED severity."
    required: false
    default: "false"
  upload-sarif:
    description: "Upload the SARIF file to code scanning. Set to false to skip."
    required: false
    default: "true"
  sarif-category:
    description: "Code-scanning category, so multiple cronproof runs do not overwrite each other."
    required: false
    default: "cronproof"

outputs:
  sarif-file:
    description: "Path to the SARIF file the action produced."
    value: ${{ steps.scan.outputs.sarif-file }}
  exit-code:
    description: "The cronproof exit code: 0 clean, 1 hazards at/above fail-on, 3 tzdb drift."
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    # Pinned to the exact release in the repository's .nvmrc, not the "22"
    # range. cronproof cross-checks the runtime's ICU tzdb against the
    # vendored zoneinfo tree and exits 3 when they name different releases,
    # and the ICU tzdb moves within a Node major. node-version-file cannot
    # be used here: setup-node resolves it against the caller's workspace,
    # which is the repository being scanned, not this action. The
    # tests/ci/action-node-pin.test.ts case fails if this drifts from .nvmrc.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22.16.0"

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: "10.13.1"

    - name: Build cronproof
      shell: bash
      run: |
        cd "${{ github.action_path }}/.."
        pnpm install --frozen-lockfile
        pnpm run build

    - name: Run cronproof scan
      id: scan
      shell: bash
      env:
        CRONPROOF_PATH: ${{ inputs.path }}
        CRONPROOF_FAIL_ON: ${{ inputs.fail-on }}
        CRONPROOF_BASELINE: ${{ inputs.baseline }}
        CRONPROOF_TZDB: ${{ inputs.tzdb-check }}
        CRONPROOF_IDEMPOTENT: ${{ inputs.idempotent }}
      run: |
        set -o pipefail
        cli="${{ github.action_path }}/../dist/cli.js"
        sarif="${RUNNER_TEMP:-/tmp}/cronproof.sarif"
        args=(scan "$CRONPROOF_PATH" --format sarif --fail-on "$CRONPROOF_FAIL_ON")
        if [ -n "$CRONPROOF_BASELINE" ]; then args+=(--baseline "$CRONPROOF_BASELINE"); fi
        if [ -n "$CRONPROOF_TZDB" ]; then args+=(--tzdb-check "$CRONPROOF_TZDB"); fi
        if [ "$CRONPROOF_IDEMPOTENT" = "true" ]; then args+=(--idempotent); fi
        set +e
        node "$cli" "${args[@]}" > "$sarif"
        code=$?
        set -e
        echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -s "$sarif" ] && head -c 1 "$sarif" | grep -q '{'; then
          echo "sarif-ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-ready=false" >> "$GITHUB_OUTPUT"
        fi
        echo "cronproof exit code: $code"

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-ready == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: ${{ inputs.sarif-category }}

    - name: Fail on hazards or tzdb drift
      shell: bash
      run: |
        code="${{ steps.scan.outputs.exit-code }}"
        if [ "$code" != "0" ]; then
          echo "cronproof gate failed with exit code $code" >&2
          exit "$code"
        fi
        echo "cronproof gate passed"
